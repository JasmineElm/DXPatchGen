[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dxpatchgen"
version = "0.1.0"
description = "Modular Yamaha DX7 patch generator, mutator, bank manager, CLI & TUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DXPatchGen Authors" }
]
keywords = ["dx7", "yamaha", "fm-synthesis", "synthesizer", "patch-generator", "sysex", "midi", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.58.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[project.scripts]
dxpatchgen = "dxpatchgen.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dxpatchgen"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
